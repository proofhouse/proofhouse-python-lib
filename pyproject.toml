[project]
name = "proofhouse-python-lib"
version = "0.1.0"
description = "Reference library for the Proofhouse Python lib reference repository"
authors = [{ name = "Tony Burns", email = "tony@tonyburns.net" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

# The test group exists so the CI test matrix can sync it on its own,
# leaving the lint tools out. complexipy publishes no free-threaded
# wheels and its sdist will not link against 3.14t on Windows; the
# matrix slots never run lint tooling, so they skip installing it.
[dependency-groups]
dev = [
  { include-group = "test" },
  "bandit>=1.9.4",
  "complexipy>=5.5.0",
  "cosmic-ray>=8.4.6",
  "diff-cover>=10.3.0",
  # import-linter already drags grimp in, but the diff-mutation script
  # reaches for its import graph by name, so the dependency earns its own
  # line instead of leaning on a contract gate to keep supplying it.
  "grimp>=3.14",
  # hypofuzz is AGPL-3.0, so it stays a developer tool: it drives the
  # existing hypothesis property tests under coverage-guided search and is
  # never imported by the Apache-2.0 package or carried into a wheel.
  "hypofuzz>=25.11.1",
  "import-linter>=2.11",
  "pip-audit>=2.10.1",
  "pylint>=4.0.5",
  "pyrefly>=1.0.0",
  "reuse[charset-normalizer]>=6.2.0",
  "ruff>=0.15.17",
  "vulture>=2.16",
]
# pytest-cov belongs to the test group, not dev: the matrix syncs that
# group alone, and each slot calls `just cover-slot` to record its own
# coverage. hypothesis rides here too: every slot collects the property
# suite, so the generator has to be present wherever the suite runs.
# pytest-xdist joins them for the same reason — `just cover-slot` passes
# `-n auto`, so the worker plugin has to be installed on every slot — and
# pytest-randomly, which reorders each run, has to ride along so a slot
# never collects in a fixed order the local runs no longer use. diff-cover
# sits up in dev because the lone coverage job — never a per-slot run —
# invokes it.
test = [
  "hypothesis>=6.155.2",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=4.1.0",
  "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

# cosmic-ray drags GitPython in transitively and constrains nothing, so
# the resolver is free to settle on a release carrying the 2026 argument
# and option injection advisories (GHSA-94p4-4cq8-9g67 and the seven
# before it). Nothing here imports GitPython, and the mutation tooling
# never runs it over untrusted input, but a dev-only path is still a
# path: the floor keeps the locked closure on a patched line.
[tool.uv]
constraint-dependencies = ["gitpython>=3.1.55"]

[tool.bandit]
# bandit reads this table when the recipe passes `-c pyproject.toml`.
# The scan walks src alone (the recipe names it), and exclude_dirs keeps
# the walk off the suite even if a future target ever points wider. Tests
# are left out on purpose: they lean on assert (B101), seed throwaway
# values, and otherwise trip rules that only read as smells outside
# production code. Their security is not waived, though — ruff's S rules
# still run over tests, minus the pytest-API carve-outs pinned in
# [tool.ruff.lint.per-file-ignores], so the assertion idiom passes there
# while real findings would not. No test IDs are skipped here: bandit's
# whole catalog runs against the shipped code, since a published library
# hands that code, and every advisory hiding in it, straight to its
# importers.
exclude_dirs = ["tests"]

[tool.complexipy]
# Scope and ceiling live in config, not recipe flags, so an editor
# plugin, the pre-commit hook, and a bare `complexipy` all measure
# the same tree under the same limit as CI.
paths = ["src", "tests"]
# Matches the gocognit ceiling in the Go twin and Sonar's default.
# complexipy ships the same default today; pinning it here keeps an
# upstream default change from moving the gate without a diff.
max-complexity-allowed = 15

[tool.importlinter]
root_package = "proofhouse_python_lib"

# The expression pipeline flows one way: the parser consumes the lexer's
# tokens and builds AST nodes, the lexer produces tokens, and every stage
# may raise from errors. An upward import (tokens reaching into the
# parser, say) would close that flow into a cycle, so each stage may only
# see the stages beneath it. Two consumers cap the stack — the evaluator
# reduces a parsed tree to a value and the formatter renders one back to
# text — and they sit on one layer joined by `|`, which forbids either
# from importing the other. Neither has any business knowing the other
# exists: a value and its source spelling are independent readings of the
# same tree, reached from the shared pipeline below, not from each other.
[[tool.importlinter.contracts]]
name = "expression pipeline stages stay ordered"
type = "layers"
containers = ["proofhouse_python_lib"]
layers = ["evaluator | formatter", "parser", "ast", "lexer", "tokens", "errors"]

# The testing helpers ship in the wheel for downstream test suites.
# Were a pipeline stage to import them, a test-only projection like
# kinds() would become part of the engine's runtime surface, so every
# stage is barred from the subpackage outright. The formatter joins the
# roster alongside the evaluator: both are leaves a downstream suite
# drives, never code those helpers may reach back into.
[[tool.importlinter.contracts]]
name = "pipeline stages stay clear of testing helpers"
type = "forbidden"
source_modules = [
  "proofhouse_python_lib.evaluator",
  "proofhouse_python_lib.formatter",
  "proofhouse_python_lib.parser",
  "proofhouse_python_lib.ast",
  "proofhouse_python_lib.lexer",
  "proofhouse_python_lib.tokens",
  "proofhouse_python_lib.errors",
]
forbidden_modules = ["proofhouse_python_lib.testing"]

[tool.pylint.main]
# tests/ stays __init__-free for pytest's importlib mode, and pylint
# rejects plain directories unless told to recurse into them.
recursive = true

[tool.pylint."messages control"]
# Only the similarities checker runs. ruff and pyrefly already police
# style, correctness, and typing, and a second opinion on those rules
# would just produce dueling findings; the one diagnostic neither of
# them can emit is cross-file duplicate-code, so the catalog goes dark
# except for it.
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
# A clone is four matching lines. That is pylint's own default, written
# down so the threshold can only change through a reviewed edit here,
# never through an upstream release.
min-similarity-lines = 4
# Modules in one package naturally import the same neighbors, and
# docstrings restate the same contracts in the same words; neither is
# logic worth deduplicating, so both stay outside the comparison.
ignore-imports = true
ignore-docstrings = true

[tool.coverage.run]
# Track which arm of each conditional a test takes, not merely which
# lines run. The engine is dense with branches — every precedence
# comparison in the parser, every operator case the evaluator and
# formatter match on — and a perfect line score can still leave one
# side of such a fork never taken. Branch mode is what surfaces that.
branch = true
# Instrument the published package, leaving the suite itself out of the
# tally. A test that runs but asserts nothing would otherwise score its
# own lines as covered; the later property and mutation gates are what
# confirm the suite actually pins the engine's behavior.
source = ["src"]
# Record each measured path relative to the repo root. The CI matrix
# writes one data file per slot and a downstream job combines them, and
# an absolute path baked in on a Windows runner would refuse to line up
# with the same module measured on Linux.
relative_files = true

[tool.coverage.report]
# The bar this gate sets: no line of the engine ships without a test
# reaching it. A genuinely unreachable line earns a documented entry in
# exclude_also below, never a threshold dialed under 100.
fail_under = 100
show_missing = true
# Patterns whose lines stand outside the count, each with the reason it
# cannot run under the suite. The set starts here and grows only when a
# new construct provably cannot execute, not to paper over a missing test.
exclude_also = [
  # A TYPE_CHECKING block exists for the type checker alone and never
  # executes at import time.
  "if TYPE_CHECKING:",
  # A wildcard arm guarded by assert_never is one pyrefly has already
  # proven dead; reaching it under test would be a bug, not a tested
  # path. The match spans both lines, so it drops the `case _:`
  # introducer and the impossible edge into it together with the
  # assert_never body that documents and type-checks the guarantee.
  # Tying the exclusion to the assert_never pairing keeps a future
  # wildcard arm that does real work inside the coverage count.
  "case _:\\n\\s*assert_never\\(",
  # The __main__ entry guard runs only when a module is executed as a
  # script, which the suite never does.
  "if __name__ == \"__main__\":",
]

[tool.pytest]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib"
]
testpaths = ["tests"]

[tool.pyrefly]
# The strict preset is the most demanding baseline pyrefly ships
# (parameter annotations required, implicit Any rejected). The errors
# table below then pins every diagnostic kind pyrefly defines to error
# severity, so a preset change upstream can never quietly relax the
# gate.
preset = "strict"
# The mutscope helper under tools/ never ships, but it steers a merge
# gate, so it answers to the same strict checker the engine does rather
# than slipping past as an unchecked side script.
project-includes = ["src", "tests", "tools"]

[tool.pyrefly.errors]
abstract-method-call = "error"
annotation-mismatch = "error"
assert-type = "error"
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
bad-function-definition = "error"
bad-index = "error"
bad-instantiation = "error"
bad-keyword-argument = "error"
bad-match = "error"
bad-override = "error"
bad-override-mutable-attribute = "error"
bad-override-param-name = "error"
bad-param-name-override = "error"
bad-raise = "error"
bad-return = "error"
bad-specialization = "error"
bad-typed-dict = "error"
bad-typed-dict-key = "error"
bad-unpacking = "error"
deprecated = "error"
division-by-zero = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
implicit-import = "error"
implicitly-defined-attribute = "error"
incompatible-overload-residual = "error"
inconsistent-inheritance = "error"
inconsistent-overload = "error"
inconsistent-overload-default = "error"
internal-error = "error"
invalid-annotation = "error"
invalid-argument = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
invalid-literal = "error"
invalid-overload = "error"
invalid-param-spec = "error"
invalid-pattern = "error"
invalid-self-type = "error"
invalid-super-call = "error"
invalid-syntax = "error"
invalid-type-alias = "error"
invalid-type-var = "error"
invalid-type-var-tuple = "error"
invalid-variance = "error"
invalid-yield = "error"
missing-argument = "error"
missing-attribute = "error"
missing-import = "error"
missing-module-attribute = "error"
missing-override-decorator = "error"
missing-source = "error"
missing-source-for-stubs = "error"
name-mismatch = "error"
no-access = "error"
no-matching-overload = "error"
non-convergent-recursion = "error"
non-exhaustive-match = "error"
not-a-type = "error"
not-async = "error"
not-callable = "error"
not-iterable = "error"
not-required-key-access = "error"
open-unpacking = "error"
parse-error = "error"
protocol-implicitly-defined-attribute = "error"
read-only = "error"
redefinition = "error"
redundant-cast = "error"
redundant-condition = "error"
reveal-type = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-protocol-member = "error"
unannotated-return = "error"
unbound-name = "error"
unexpected-keyword = "error"
unexpected-positional-argument = "error"
unimported-directive = "error"
unknown-name = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unresolvable-dunder-all = "error"
unsafe-overlap = "error"
unsupported = "error"
unsupported-delete = "error"
unsupported-operation = "error"
untyped-import = "error"
unused-coroutine = "error"
unused-ignore = "error"
variance-mismatch = "error"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Conflicts with the formatter (ruff itself warns when enabled).
  "COM812",
  # Conflicts with the formatter (ruff itself warns when enabled).
  "ISC001",
  # Docstrings land where they carry signal, not as ritual on every
  # module, class, and function.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  # License headers are enforced by the reuse SPDX gate, and CPY001
  # is preview-only.
  "CPY",
  # Plain TODOs without an author or linked issue are allowed.
  "TD002",
  "TD003",
  "FIX002",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["proofhouse_python_lib"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # Bare asserts are pytest's assertion API.
  "S101",
  # Literal expected values in test tables read better than named
  # constants.
  "PLR2004",
  # Test dirs are intentionally __init__-free under importlib mode.
  "INP001",
]
"tools/**" = [
  # Dev scripts here run from the shell and are never imported, so the
  # directory carries no __init__ (INP001), matching how tests sit.
  "INP001",
  # The script reports its scope and survivor tally over the standard
  # streams; print is its way of talking back, not a leftover trace
  # (T201).
  "T201",
  # An argv index compared against a small literal reads plainer in
  # place than wrapped in a named constant (PLR2004).
  "PLR2004",
]

[tool.vulture]
# src and tests scan as one tree on purpose: a library's exported
# names have no callers inside src itself, so the test suite is what
# proves a definition live. A public helper no test touches is either
# untested or dead, and vulture flagging it forces that question.
# There is no allowlist today because nothing here gets invoked
# through a registry, decorator, or packaging entry point that a
# static scan would miss; if one ever becomes necessary, each entry
# must say which hidden caller justifies it.
paths = ["src", "tests"]
