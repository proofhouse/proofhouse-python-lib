---
# Main quality gate. Runs the Python lint aggregator, the test suite
# (matrixed across linux/macOS/windows native runners, crossed with
# CPython 3.12 through 3.14 plus the free-threaded 3.14t build), and
# the lock-drift check on every pull request and every push to
# `main`. Each gate
# runs as its own job so a flake in one block does not require
# rerunning the others and the PR status surfaces which gate fired.
# The prose, spelling, Markdown, config, and YAML lint gates land in
# follow-up workflows that handle each tool's distinct install path.
#
# Every job installs `just` from a SHA-pinned casey/just release
# tarball, verifies the bundled SHA256SUMS, and then invokes the
# matching `just <recipe>` so the recipe is the single source of
# truth for what the gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint-py-all` aggregator recipe, so the job
  # stays unchanged as new Python gates land — each gate appends
  # itself to the aggregator in the Justfile instead.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@c55eeb3115d95f6b8777538b4d6f49d48830e199 # v0.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Run Python lint gates
        run: just lint-py-all

  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@c55eeb3115d95f6b8777538b4d6f49d48830e199 # v0.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Check lock drift
        run: just lock-check

  test:
    name: "test (${{ matrix.os }}, ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    # Each slot pushes its own report to GitHub's code coverage API,
    # which wants code-quality: write alongside the reads it already
    # uses — contents for the checkout, and pull-requests so the upload
    # action can look up the PR number on push events. A job-level block
    # overrides the workflow default, so the reads are restated here.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
        python:
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.14t'
    # uv reads UV_PYTHON when picking an interpreter, so `uv sync`
    # below and the `uv run` inside the test recipe both target the
    # slot's Python without any recipe changes.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@c55eeb3115d95f6b8777538b4d6f49d48830e199 # v0.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # Only the test group: this job never runs lint tooling, and
      # complexipy ships no free-threaded wheels — a full dev-group
      # sync would compile it from source on the 3.14t slots and the
      # link step breaks on Windows.
      - name: Sync dependencies
        run: uv sync --frozen --no-default-groups --group test

      # UV_NO_SYNC stops the `uv run` inside the recipes from restoring
      # the default dev group on top of the test-only environment synced
      # above. cover-slot runs the suite under coverage, writes this
      # slot's data to .coverage.<slot>, and renders its Cobertura.
      - name: Run tests with coverage
        env:
          UV_NO_SYNC: "1"
        run: just cover-slot "${{ matrix.os }}-${{ matrix.python }}"

      # Publish this slot's report under a per-slot label so each
      # os/python pair shows separately, and keep the raw data file for
      # the coverage job to fold into the binding total.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@abb5995db9e0199b0e2bb9dbd136fce4cb1ec4d3 # v1.3.0
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/${{ matrix.os }}-${{ matrix.python }}
          fail-on-error: false

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: test
    # Pushes the merged report to the code coverage API under the same
    # scopes the per-slot uploads in the test job request.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # diff-cover needs the base branch to compare against, so take the
      # full history rather than the default shallow clone.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@c55eeb3115d95f6b8777538b4d6f49d48830e199 # v0.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # The combine and diff steps run out of the dev group: diff-cover
      # lives there, and coverage rides in beside pytest-cov.
      - name: Sync dependencies
        run: uv sync --frozen

      # Each slot wrote .coverage.<slot>; merge-multiple drops them all
      # back into the working directory under their original names, where
      # `coverage combine` picks them up.
      - name: Download per-slot coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage and enforce the threshold
        env:
          UV_NO_SYNC: "1"
        run: just cover-combine

      # The combined total already enforces 100%; this fails the PR
      # sooner if an edited line slips through uncovered, before the
      # merged total would surface it. diff-cover diffs against the base
      # branch, which a PR checkout leaves no tracking ref for, so fetch
      # it first. github.base_ref is set only on pull requests, so the
      # step is scoped to them.
      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        env:
          UV_NO_SYNC: "1"
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          just cover-diff "origin/${{ github.base_ref }}"

      - name: Upload combined coverage report
        uses: actions/upload-code-coverage@abb5995db9e0199b0e2bb9dbd136fce4cb1ec4d3 # v1.3.0
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/combined
          fail-on-error: false
