---
# Scheduled mutation sweep over the whole library. cosmic-ray edits one
# construct at a time — a comparison in the precedence climber, an
# arithmetic step in the Fraction evaluator, a bracketing rule in the
# formatter — replays the suite against each edit, and tallies the
# mutants the tests catch against the ones that slip through. Replaying
# the suite per mutant is far too slow for a pull request, so the full
# pass runs here on a clock; the bounded gate that blocks a merge is the
# diff-scoped score check elsewhere. The job runs the same `just
# mutate-all` a contributor runs by hand, changing only MUTATION_TIMEOUT,
# which keeps the recipe and cosmic-ray.toml the lone account of what is
# mutated and which equivalents are excluded.
#
# mutate-all exits zero at every rate, so a surviving mutant shows up in
# the log without turning the run red. A reader walks the SURVIVED block
# for the assertion a 100% branch figure never demanded.

name: mutation-nightly

on:
  schedule:
    # 04:37 UTC nightly. Off-peak and away from the top of the hour, on a
    # minute of its own so it never queues behind the daily security scan
    # (06:19) or the weekly CodeQL pass (04:43 on Sundays).
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      mutation_timeout:
        description: "Per-mutant test budget in seconds (cosmic-ray timeout)"
        type: string
        default: "30.0"

permissions:
  contents: read

concurrency:
  # Hold scheduled and dispatched runs in one line so a manual kick never
  # collides with the cron. A run already underway finishes rather than
  # being cut off, since an abandoned sweep buys nothing.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutate:
    name: mutate
    runs-on: ubuntu-24.04
    # Runtime grows with the mutant count times one suite run, since each
    # mutant pays for a full replay. Today's set returns in minutes; the
    # ceiling stays roomy and gets revisited as the module set grows.
    timeout-minutes: 60
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run mutation sweep
        env:
          # A scheduled run carries no inputs, so default to the dispatch value.
          MUTATION_TIMEOUT: ${{ github.event.inputs.mutation_timeout || '30.0' }}
        run: just mutate-all
