---
# CodeQL static analysis over the library's Python sources and over the
# GitHub Actions workflows that drive its CI. Every advisory the suite
# raises lands in the repository's code-scanning dashboard as SARIF, so
# a taint path through a published, typed package surfaces before a
# release carries it into a consumer's import graph.
#
# Pull requests and pushes to `main` analyze the change; a weekly run
# re-grades an unchanged `main` against query packs CodeQL has shipped
# since the last commit, which is when most new rules arrive.
#
# Each language gets its own matrix slot. Python is interpreted, so the
# extractor reads the tree with no build step; the Actions slot scans
# the workflow YAML the same way. Both draw on `security-extended`,
# which turns on the wider security rule set while leaving out the
# code-quality queries that would retread ground ruff and pyrefly
# already hold.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Sunday 05:17 UTC. Off the top of the hour and clear of the
    # daily osv-scanner cron, and a minute the twin's CodeQL run does not
    # share, so the two repositories do not queue their weekly sweep into
    # one slot.
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: "analyze (${{ matrix.language }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
